<media-container class="media-skin media-container media-audio" data-theme="sleeve" data-preset="audio">
<!-- Add a compatible media component here. -->
<media-error-dialog>
<media-dialog-backdrop class="media-dialog-backdrop">
</media-dialog-backdrop>
<media-dialog-popup class="media-dialog-popup">
<div class="sleeve-dialog-head">
<span class="sleeve-dialog-label">Error</span>
<media-dialog-title class="media-dialog-title">
</media-dialog-title>
</div>
<media-dialog-description class="media-dialog-description">
</media-dialog-description>
<media-dialog-close class="media-button media-dialog-close"></media-dialog-close>
</media-dialog-popup>
</media-error-dialog>
<media-buffering-indicator class="media-buffering-indicator" role="status">
<span class="sleeve-sr-only">Buffering</span>
</media-buffering-indicator>
<div class="sleeve-cover">
<div class="sleeve-type">
<span class="sleeve-side" aria-hidden="true">
<span class="sleeve-word-ready">Ready</span>
<media-text class="sleeve-word-paused" token="status.paused">Paused</media-text>
<media-text class="sleeve-word-playing" token="status.playing">Playing</media-text>
<span class="sleeve-word-ended">Ended</span>
<span class="sleeve-word-buffering">Buffering</span>
<span class="sleeve-word-error">Error</span>
</span>
<media-title class="sleeve-title">
</media-title>
<span class="sleeve-numeral" aria-hidden="true">
<media-time class="sleeve-numeral-total" type="duration">
</media-time>
<media-time class="sleeve-numeral-left" type="remaining">
</media-time>
</span>
</div>
<div class="sleeve-art" aria-hidden="true">
<media-title class="sleeve-print">
</media-title>
<media-poster class="media-poster">
<img alt="" decoding="async" class="media-poster-image">
</media-poster>
<media-time-slider class="sleeve-spine" disabled inert>
<media-slider-track class="sleeve-spine-track">
<media-slider-fill class="sleeve-spine-fill">
</media-slider-fill>
</media-slider-track>
</media-time-slider>
</div>
</div>
<media-controls visibility="always">
<media-controls-content class="sleeve-strip">
<media-tooltip-group>
<div class="sleeve-play-cell">
<media-play-button class="media-play-button sleeve-play" id="sleeve-play-trigger">
<media-icon family="sleeve" name="restart" class="media-button-icon-base media-play-button-restart-icon">
</media-icon>
<media-icon family="sleeve" name="play" class="media-button-icon-base media-play-button-play-icon">
</media-icon>
<media-icon family="sleeve" name="pause" class="media-button-icon-base media-play-button-pause-icon">
</media-icon>
</media-play-button>
<media-tooltip trigger="sleeve-play-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
</div>
<div class="sleeve-slider-row">
<media-time-slider class="media-time-slider" thumb-alignment="edge">
<media-time-slider-chapters class="media-time-slider-chapters">
<template>
<div class="media-time-slider-chapter">
<media-slider-track class="media-time-slider-track">
<media-slider-buffer class="media-time-slider-buffer">
</media-slider-buffer>
<media-slider-fill class="media-time-slider-fill">
</media-slider-fill>
</media-slider-track>
</div>
</template>
</media-time-slider-chapters>
<media-slider-thumb class="media-time-slider-thumb">
</media-slider-thumb>
<media-slider-preview class="media-time-slider-preview">
<div class="media-time-slider-preview-meta">
<div class="media-time-slider-preview-label">
<media-slider-value class="media-time-slider-value" type="pointer">
</media-slider-value>
<media-time-slider-chapter-title class="media-time-slider-chapter-title">
</media-time-slider-chapter-title>
</div>
</div>
</media-slider-preview>
</media-time-slider>
</div>
<div class="sleeve-cells">
<media-seek-button seconds="-10" class="media-button sleeve-seek-button" id="sleeve-seek-back-trigger">
<media-icon family="sleeve" name="seek" class="media-button-icon sleeve-seek-icon">
</media-icon>
<span class="sleeve-seek-value">10</span>
</media-seek-button>
<media-tooltip trigger="sleeve-seek-back-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<media-seek-button seconds="10" class="media-button sleeve-seek-button" id="sleeve-seek-fwd-trigger">
<media-icon family="sleeve" name="seek" class="media-button-icon sleeve-seek-icon">
</media-icon>
<span class="sleeve-seek-value">10</span>
</media-seek-button>
<media-tooltip trigger="sleeve-seek-fwd-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<div class="sleeve-cell sleeve-time-cell">
<media-time-group class="media-time-group">
<media-time class="media-time-current-value" type="current" toggle>
</media-time>
<media-time-separator class="media-time-separator">
</media-time-separator>
<media-time class="media-time-duration-value" type="duration">
</media-time>
</media-time-group>
</div>
<div class="sleeve-cell sleeve-volume-cell">
<media-mute-button class="media-button media-mute-button" id="sleeve-mute-trigger">
<media-icon family="sleeve" name="volume-off" class="media-button-icon media-mute-button-off-icon">
</media-icon>
<media-icon family="sleeve" name="volume-high" class="media-button-icon media-mute-button-high-icon">
</media-icon>
</media-mute-button>
<media-tooltip trigger="sleeve-mute-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<media-volume-slider class="media-volume-slider" thumb-alignment="edge">
<media-slider-track class="media-volume-slider-track">
<media-slider-fill class="media-volume-slider-fill">
</media-slider-fill>
</media-slider-track>
<media-slider-thumb class="media-volume-slider-thumb">
</media-slider-thumb>
</media-volume-slider>
</div>
<media-playback-rate-button class="media-button sleeve-rate-button" id="sleeve-rate-trigger">
</media-playback-rate-button>
<media-tooltip trigger="sleeve-rate-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
</div>
</media-tooltip-group>
</media-controls-content>
</media-controls>
<media-hotkey keys="Space" action="togglePaused">
</media-hotkey>
<media-hotkey keys="k" action="togglePaused">
</media-hotkey>
<media-hotkey keys="m" action="toggleMuted">
</media-hotkey>
<media-hotkey keys="ArrowRight" action="seekStep" value="10">
</media-hotkey>
<media-hotkey keys="ArrowLeft" action="seekStep" value="-10">
</media-hotkey>
<media-hotkey keys="l" action="seekStep" value="10">
</media-hotkey>
<media-hotkey keys="j" action="seekStep" value="-10">
</media-hotkey>
<media-hotkey keys="ArrowUp" action="volumeStep">
</media-hotkey>
<media-hotkey keys="ArrowDown" action="volumeStep">
</media-hotkey>
<media-hotkey keys="0-9" action="seekToPercent">
</media-hotkey>
<media-hotkey keys="Home" action="seekToPercent" value="0">
</media-hotkey>
<media-hotkey keys="End" action="seekToPercent" value="100">
</media-hotkey>
<media-hotkey keys=">" action="speedUp">
</media-hotkey>
<media-hotkey keys="<" action="speedDown">
</media-hotkey>
<media-status-announcer class="media-status-announcer">
</media-status-announcer>
</media-container>
